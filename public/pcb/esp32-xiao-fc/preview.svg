<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="100%" stop-color="#0a1f2c"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#145c3f"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(45,212,191,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <circle cx="1040" cy="100" r="160" fill="rgba(45,212,191,0.07)"/>
  <!-- Flat front / top-down PCB (no isometric skew) -->
  <rect x="210" y="170" width="780" height="420" rx="18" fill="url(#board)" stroke="#2dd4bf" stroke-width="3"/>
  <rect x="260" y="220" width="210" height="140" rx="10" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/>
  <rect x="500" y="235" width="260" height="100" rx="8" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <circle cx="860" cy="260" r="36" fill="#1e293b" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="860" cy="370" r="36" fill="#1e293b" stroke="#5eead4" stroke-width="3"/>
  <rect x="260" y="400" width="520" height="16" rx="4" fill="#2dd4bf" opacity="0.45"/>
  <rect x="260" y="440" width="360" height="12" rx="3" fill="#5eead4" opacity="0.35"/>
  <rect x="260" y="475" width="440" height="12" rx="3" fill="#94a3b8" opacity="0.3"/>
  <text x="56" y="64" fill="#5eead4" font-family="Segoe UI, Arial" font-size="18" font-weight="700" letter-spacing="4">AEROMEK · AI ROBOTICS LAB</text>
  <text x="56" y="118" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="38" font-weight="800">ESP32 XIAO Flight Controller</text>
  <text x="56" y="158" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="18">Micro-drone FC · closed-source PCB</text>
  <rect x="56" y="180" width="240" height="28" rx="8" fill="rgba(45,212,191,0.12)" stroke="rgba(45,212,191,0.4)"/>
  <text x="72" y="199" fill="#99f6e4" font-family="Segoe UI, Arial" font-size="13" font-weight="600">PROPRIETARY · FRONT VIEW</text>
